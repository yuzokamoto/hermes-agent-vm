name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workstation:
    name: Workstation configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate repository contract and secrets
        run: make validate

      - name: Lint operational scripts
        run: shellcheck -x -e SC1091 scripts/*.sh

      - name: Lint bootstrap scripts
        run: shellcheck -x -e SC1091 bootstrap/*.sh

  legacy-infrastructure:
    name: Legacy OpenTofu configuration
    runs-on: ubuntu-24.04
    if: ${{ hashFiles('infra/opentofu/**/*.tf') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.8"

      - name: Check OpenTofu formatting
        run: tofu -chdir=infra/opentofu fmt -check -recursive

      - name: Initialize OpenTofu
        run: tofu -chdir=infra/opentofu init -backend=false

      - name: Validate OpenTofu
        run: tofu -chdir=infra/opentofu validate
