name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workstation:
    name: Workstation configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate repository contract and secrets
        run: make validate

      - name: Lint operational scripts
        run: shellcheck -x -e SC1091 scripts/*.sh

      - name: Lint bootstrap scripts
        run: shellcheck -x -e SC1091 bootstrap/*.sh
