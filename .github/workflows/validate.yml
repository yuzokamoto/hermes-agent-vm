name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workstation:
    name: Workstation configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck >/dev/null

      - name: Validate repository contract and secrets
        run: bash scripts/validate.sh

      - name: Check Bash syntax
        run: |
          find bootstrap scripts -type f -name '*.sh' -print0 |
            while IFS= read -r -d '' script; do
              echo "Checking $script"
              bash -n "$script"
            done

      - name: Lint operational scripts
        run: shellcheck -S error -x -e SC1091 scripts/*.sh

      - name: Lint bootstrap scripts
        run: shellcheck -S error -x -e SC1091 bootstrap/*.sh
